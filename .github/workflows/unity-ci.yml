name: GUI CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
env:
  WSS_CI_CHANNEL: dev
permissions:
  contents: read
concurrency:
  group: unity-gui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  receipt-contracts:
    name: Release receipt safety contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject unreviewed, stale or incorrectly scoped acceptance
        shell: pwsh
        run: |
          ./.github/scripts/tests/WssReleaseReceipt.Tests.ps1
          ./.github/scripts/tests/MacOSConsumerContract.Tests.ps1
  validate:
    uses: cwru-non-academic/Unity_WSS_Integration_Lib/.github/workflows/_unity-validation.yml@0be3c728bed9e708bf94bfd3238c9588758ae194
    with:
      role: gui
      mode: committed
      gui_sha: ${{ github.sha }}
    secrets:
      WSS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
  acceptance:
    name: GUI general conformance
    if: always()
    needs: [validate, receipt-contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Require actual committed-state conformance
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          RECEIPT_RESULT: ${{ needs.receipt-contracts.result }}
        run: test "$VALIDATION_RESULT" = success && test "$RECEIPT_RESULT" = success

  platform-compatibility:
    name: GUI platform compatibility (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, label: Windows}
          - {os: ubuntu-latest, label: Ubuntu}
    steps:
      - uses: actions/checkout@v4
        with:
          path: gui
          persist-credentials: false
      - name: Resolve exact committed wrapper and fixture
        id: sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $entry = git -C gui ls-tree HEAD -- Assets/SubModules/WSSInterfacingModule
          if ($LASTEXITCODE -ne 0 -or $entry -cnotmatch '^160000 commit ([0-9a-f]{40})\s+Assets/SubModules/WSSInterfacingModule$') { throw 'Exact wrapper gitlink is required.' }
          "wrapper=$($Matches[1])" >> $env:GITHUB_OUTPUT
          $config = Get-Content gui/.github/unity-ci.json -Raw | ConvertFrom-Json
          if ($config.fixture_commit -cnotmatch '^[0-9a-f]{40}$' -or $config.dotnet_sdk -cne '9.0.316') { throw 'Unexpected fixture/SDK contract.' }
          "fixture=$($config.fixture_commit)" >> $env:GITHUB_OUTPUT
          "sdk=$($config.dotnet_sdk)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Unity_WSS_Integration_Lib
          ref: ${{ steps.sources.outputs.wrapper }}
          path: wrapper
          lfs: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: ${{ steps.sources.outputs.fixture }}
          path: fixture
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.sources.outputs.sdk }}
      - name: Verify application commands and packaged transport selection (.NET, no Unity engine)
        shell: pwsh
        env:
          WRAPPER_SHA: ${{ steps.sources.outputs.wrapper }}
          GUI_SHA: ${{ github.sha }}
        run: |
          ./wrapper/.github/scripts/Invoke-DotNetPlatformCompatibility.ps1 -WrapperRoot "$env:GITHUB_WORKSPACE/wrapper" -FixtureRoot "$env:GITHUB_WORKSPACE/fixture" -WrapperSha $env:WRAPPER_SHA -ConfigPath "$env:GITHUB_WORKSPACE/wrapper/.github/unity-ci.json" -OutputRoot "$env:RUNNER_TEMP/platform-results" -Role gui -GuiRoot "$env:GITHUB_WORKSPACE/gui" -GuiSha $env:GUI_SHA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-platform-${{ matrix.label }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/platform-results/*.json
            ${{ runner.temp }}/platform-results/*.log
            ${{ runner.temp }}/platform-results/conformance/*.json
            ${{ runner.temp }}/platform-results/conformance/*.xml
            ${{ runner.temp }}/platform-results/conformance/*.log

  macos-consumers:
    name: GUI macOS consumer (${{ matrix.cpu }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15-intel, label: macOS-x64, cpu: Intel x64, uname: x86_64}
          - {os: macos-15, label: macOS-arm64, cpu: Apple Silicon arm64, uname: arm64}
    steps:
      - name: Require the native Mac runner architecture
        shell: pwsh
        env:
          EXPECTED_UNAME: ${{ matrix.uname }}
        run: |
          if (!$IsMacOS -or (& uname -m) -cne $env:EXPECTED_UNAME) { throw 'Native macOS runner architecture mismatch.' }
      - uses: actions/checkout@v4
        with:
          path: gui
          persist-credentials: false
      - name: Resolve exact committed wrapper and fixture
        id: sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $entry = git -C gui ls-tree HEAD -- Assets/SubModules/WSSInterfacingModule
          if ($LASTEXITCODE -ne 0 -or $entry -cnotmatch '^160000 commit ([0-9a-f]{40})\s+Assets/SubModules/WSSInterfacingModule$') { throw 'Exact wrapper gitlink is required.' }
          "wrapper=$($Matches[1])" >> $env:GITHUB_OUTPUT
          $config = Get-Content gui/.github/unity-ci.json -Raw | ConvertFrom-Json
          if ($config.fixture_commit -cnotmatch '^[0-9a-f]{40}$' -or $config.dotnet_sdk -cne '9.0.316') { throw 'Unexpected fixture/SDK contract.' }
          "fixture=$($config.fixture_commit)" >> $env:GITHUB_OUTPUT
          "sdk=$($config.dotnet_sdk)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Unity_WSS_Integration_Lib
          ref: ${{ steps.sources.outputs.wrapper }}
          path: wrapper
          lfs: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: ${{ steps.sources.outputs.fixture }}
          path: fixture
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.sources.outputs.sdk }}
      - name: Verify application commands and packaged transport selection (.NET, no Unity engine)
        shell: pwsh
        env:
          WRAPPER_SHA: ${{ steps.sources.outputs.wrapper }}
          GUI_SHA: ${{ github.sha }}
        run: |
          ./wrapper/.github/scripts/Invoke-DotNetPlatformCompatibility.ps1 -WrapperRoot "$env:GITHUB_WORKSPACE/wrapper" -FixtureRoot "$env:GITHUB_WORKSPACE/fixture" -WrapperSha $env:WRAPPER_SHA -ConfigPath "$env:GITHUB_WORKSPACE/wrapper/.github/unity-ci.json" -OutputRoot "$env:RUNNER_TEMP/platform-results" -Role gui -GuiRoot "$env:GITHUB_WORKSPACE/gui" -GuiSha $env:GUI_SHA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-platform-${{ matrix.label }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/platform-results/*.json
            ${{ runner.temp }}/platform-results/*.log
            ${{ runner.temp }}/platform-results/conformance/*.json
            ${{ runner.temp }}/platform-results/conformance/*.xml
            ${{ runner.temp }}/platform-results/conformance/*.log

  macos:
    name: GUI platform compatibility (macOS)
    if: always()
    needs: macos-consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gui-platform-macOS-x64
          path: ${{ runner.temp }}/macos-evidence/x64
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gui-platform-macOS-arm64
          path: ${{ runner.temp }}/macos-evidence/arm64
      - name: Require Intel and Apple Silicon consumer success
        shell: pwsh
        env:
          MATRIX_RESULT: ${{ needs.macos-consumers.result }}
        run: ./.github/scripts/Test-MacOSConsumers.ps1 -EvidenceRoot "$env:RUNNER_TEMP/macos-evidence" -MatrixResult $env:MATRIX_RESULT
