name: GUI CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
env:
  WSS_CI_CHANNEL: dev
permissions:
  contents: read
concurrency:
  # Only stale PR checks supersede one another. Preserve every committed run.
  # run_id also prevents pending replacement between same-source dispatches.
  group: unity-gui-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}-${{ github.event_name == 'pull_request' && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  receipt-contracts:
    name: Release receipt safety contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject unreviewed, stale or incorrectly scoped acceptance
        shell: pwsh
        run: |
          ./.github/scripts/tests/WssReleaseReceipt.Tests.ps1
          ./.github/scripts/tests/MacOSConsumerContract.Tests.ps1
  validate:
    uses: cwru-non-academic/Unity_WSS_Integration_Lib/.github/workflows/_unity-validation.yml@744a3ae73aa526fc001b692aa6037e56653b38e5
    with:
      role: gui
      mode: committed
      gui_sha: ${{ github.sha }}
    secrets:
      WSS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
  acceptance:
    name: GUI general conformance
    if: always()
    needs: [validate, receipt-contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Require actual committed-state conformance
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          RECEIPT_RESULT: ${{ needs.receipt-contracts.result }}
        run: test "$VALIDATION_RESULT" = success && test "$RECEIPT_RESULT" = success

  platform-compatibility:
    name: GUI platform compatibility (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, label: Windows}
          - {os: ubuntu-latest, label: Ubuntu}
    steps:
      - uses: actions/checkout@v4
        with:
          path: gui
          persist-credentials: false
      - name: Resolve exact committed wrapper and fixture
        id: sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $entry = git -C gui ls-tree HEAD -- Assets/SubModules/WSSInterfacingModule
          if ($LASTEXITCODE -ne 0 -or $entry -cnotmatch '^160000 commit ([0-9a-f]{40})\s+Assets/SubModules/WSSInterfacingModule$') { throw 'Exact wrapper gitlink is required.' }
          "wrapper=$($Matches[1])" >> $env:GITHUB_OUTPUT
          $body=Get-Content gui/.github/workflows/unity-ci.yml -Raw
          $pins=[regex]::Matches($body,'(?m)^\s*uses: cwru-non-academic/Unity_WSS_Integration_Lib/\.github/workflows/_unity-validation\.yml@([a-f0-9]{40})\s*$')
          if($pins.Count -ne 1){throw 'Exactly one literal reviewed Unity tooling pin is required.'}
          "tooling=$($pins[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
          $config = Get-Content gui/.github/unity-ci.json -Raw | ConvertFrom-Json
          if ($config.fixture_commit -cnotmatch '^[0-9a-f]{40}$' -or $config.dotnet_sdk -cne '9.0.316') { throw 'Unexpected fixture/SDK contract.' }
          "fixture=$($config.fixture_commit)" >> $env:GITHUB_OUTPUT
          "sdk=$($config.dotnet_sdk)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Unity_WSS_Integration_Lib
          ref: ${{ steps.sources.outputs.wrapper }}
          path: wrapper
          lfs: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Unity_WSS_Integration_Lib
          ref: ${{ steps.sources.outputs.tooling }}
          path: tooling
          persist-credentials: false
      - name: Resolve fixture from authenticated actual payload using trusted tooling
        id: profile
        shell: pwsh
        env:
          TOOL_SHA: ${{ steps.sources.outputs.tooling }}
          WRAPPER_SHA: ${{ steps.sources.outputs.wrapper }}
        run: |
          . ./tooling/.github/scripts/UnityContract.ps1
          . ./tooling/.github/scripts/UnityProfiles.ps1
          . ./tooling/.github/scripts/UnityTooling.ps1
          $tools=Join-Path $env:GITHUB_WORKSPACE 'tooling'
          $product=Join-Path $env:GITHUB_WORKSPACE 'wrapper'
          $configPath=Join-Path $tools '.github/unity-ci.json'
          $null=Resolve-UnityTooling $tools $env:TOOL_SHA $product $env:WRAPPER_SHA $configPath
          $config=Read-UnityExecutionConfig $configPath $product
          "fixture=$($config.fixture_commit)" >> $env:GITHUB_OUTPUT
          "sdk=$($config.dotnet_sdk)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: ${{ steps.profile.outputs.fixture }}
          path: fixture
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.profile.outputs.sdk }}
      - name: Verify application commands and packaged transport selection (.NET, no Unity engine)
        shell: pwsh
        env:
          WRAPPER_SHA: ${{ steps.sources.outputs.wrapper }}
          GUI_SHA: ${{ github.sha }}
          TOOL_SHA: ${{ steps.sources.outputs.tooling }}
        run: |
          ./tooling/.github/scripts/Invoke-DotNetPlatformCompatibility.ps1 -ToolRoot "$env:GITHUB_WORKSPACE/tooling" -ToolSha $env:TOOL_SHA -WrapperRoot "$env:GITHUB_WORKSPACE/wrapper" -FixtureRoot "$env:GITHUB_WORKSPACE/fixture" -WrapperSha $env:WRAPPER_SHA -ConfigPath "$env:GITHUB_WORKSPACE/tooling/.github/unity-ci.json" -OutputRoot "$env:RUNNER_TEMP/platform-results" -Role gui -GuiRoot "$env:GITHUB_WORKSPACE/gui" -GuiSha $env:GUI_SHA
      - name: Verify actual GUI calibration source with the existing host emulator
        shell: pwsh
        run: ./gui/Tests~/GuiSourceBoundary/Run.ps1 -WrapperRoot "$env:GITHUB_WORKSPACE/wrapper" -ToolRoot "$env:GITHUB_WORKSPACE/tooling" -OutputRoot "$env:RUNNER_TEMP/platform-results/gui-source-boundary"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-platform-${{ matrix.label }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/platform-results/*.json
            ${{ runner.temp }}/platform-results/*.log
            ${{ runner.temp }}/platform-results/conformance/*.json
            ${{ runner.temp }}/platform-results/conformance/*.xml
            ${{ runner.temp }}/platform-results/conformance/*.log
            ${{ runner.temp }}/platform-results/gui-source-boundary/*.json
            ${{ runner.temp }}/platform-results/gui-source-boundary/*.trx

  macos-consumers:
    name: GUI macOS consumer (${{ matrix.cpu }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15-intel, label: macOS-x64, cpu: Intel x64, uname: x86_64}
          - {os: macos-15, label: macOS-arm64, cpu: Apple Silicon arm64, uname: arm64}
    steps:
      - name: Require the native Mac runner architecture
        shell: pwsh
        env:
          EXPECTED_UNAME: ${{ matrix.uname }}
        run: |
          if (!$IsMacOS -or (& uname -m) -cne $env:EXPECTED_UNAME) { throw 'Native macOS runner architecture mismatch.' }
      - uses: actions/checkout@v4
        with:
          path: gui
          persist-credentials: false
      - name: Resolve exact committed wrapper and fixture
        id: sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $entry = git -C gui ls-tree HEAD -- Assets/SubModules/WSSInterfacingModule
          if ($LASTEXITCODE -ne 0 -or $entry -cnotmatch '^160000 commit ([0-9a-f]{40})\s+Assets/SubModules/WSSInterfacingModule$') { throw 'Exact wrapper gitlink is required.' }
          "wrapper=$($Matches[1])" >> $env:GITHUB_OUTPUT
          $body=Get-Content gui/.github/workflows/unity-ci.yml -Raw
          $pins=[regex]::Matches($body,'(?m)^\s*uses: cwru-non-academic/Unity_WSS_Integration_Lib/\.github/workflows/_unity-validation\.yml@([a-f0-9]{40})\s*$')
          if($pins.Count -ne 1){throw 'Exactly one literal reviewed Unity tooling pin is required.'}
          "tooling=$($pins[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
          $config = Get-Content gui/.github/unity-ci.json -Raw | ConvertFrom-Json
          if ($config.fixture_commit -cnotmatch '^[0-9a-f]{40}$' -or $config.dotnet_sdk -cne '9.0.316') { throw 'Unexpected fixture/SDK contract.' }
          "fixture=$($config.fixture_commit)" >> $env:GITHUB_OUTPUT
          "sdk=$($config.dotnet_sdk)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Unity_WSS_Integration_Lib
          ref: ${{ steps.sources.outputs.wrapper }}
          path: wrapper
          lfs: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Unity_WSS_Integration_Lib
          ref: ${{ steps.sources.outputs.tooling }}
          path: tooling
          persist-credentials: false
      - name: Resolve fixture from authenticated actual payload using trusted tooling
        id: profile
        shell: pwsh
        env:
          TOOL_SHA: ${{ steps.sources.outputs.tooling }}
          WRAPPER_SHA: ${{ steps.sources.outputs.wrapper }}
        run: |
          . ./tooling/.github/scripts/UnityContract.ps1
          . ./tooling/.github/scripts/UnityProfiles.ps1
          . ./tooling/.github/scripts/UnityTooling.ps1
          $tools=Join-Path $env:GITHUB_WORKSPACE 'tooling'
          $product=Join-Path $env:GITHUB_WORKSPACE 'wrapper'
          $configPath=Join-Path $tools '.github/unity-ci.json'
          $null=Resolve-UnityTooling $tools $env:TOOL_SHA $product $env:WRAPPER_SHA $configPath
          $config=Read-UnityExecutionConfig $configPath $product
          "fixture=$($config.fixture_commit)" >> $env:GITHUB_OUTPUT
          "sdk=$($config.dotnet_sdk)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: ${{ steps.profile.outputs.fixture }}
          path: fixture
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.profile.outputs.sdk }}
      - name: Verify application commands and packaged transport selection (.NET, no Unity engine)
        shell: pwsh
        env:
          WRAPPER_SHA: ${{ steps.sources.outputs.wrapper }}
          GUI_SHA: ${{ github.sha }}
          TOOL_SHA: ${{ steps.sources.outputs.tooling }}
        run: |
          ./tooling/.github/scripts/Invoke-DotNetPlatformCompatibility.ps1 -ToolRoot "$env:GITHUB_WORKSPACE/tooling" -ToolSha $env:TOOL_SHA -WrapperRoot "$env:GITHUB_WORKSPACE/wrapper" -FixtureRoot "$env:GITHUB_WORKSPACE/fixture" -WrapperSha $env:WRAPPER_SHA -ConfigPath "$env:GITHUB_WORKSPACE/tooling/.github/unity-ci.json" -OutputRoot "$env:RUNNER_TEMP/platform-results" -Role gui -GuiRoot "$env:GITHUB_WORKSPACE/gui" -GuiSha $env:GUI_SHA
      - name: Verify actual GUI calibration source with the existing host emulator
        shell: pwsh
        run: ./gui/Tests~/GuiSourceBoundary/Run.ps1 -WrapperRoot "$env:GITHUB_WORKSPACE/wrapper" -ToolRoot "$env:GITHUB_WORKSPACE/tooling" -OutputRoot "$env:RUNNER_TEMP/platform-results/gui-source-boundary"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-platform-${{ matrix.label }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/platform-results/*.json
            ${{ runner.temp }}/platform-results/*.log
            ${{ runner.temp }}/platform-results/conformance/*.json
            ${{ runner.temp }}/platform-results/conformance/*.xml
            ${{ runner.temp }}/platform-results/conformance/*.log
            ${{ runner.temp }}/platform-results/gui-source-boundary/*.json
            ${{ runner.temp }}/platform-results/gui-source-boundary/*.trx

  macos:
    name: GUI platform compatibility (macOS)
    if: always()
    needs: macos-consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gui-platform-macOS-x64
          path: ${{ runner.temp }}/macos-evidence/x64
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gui-platform-macOS-arm64
          path: ${{ runner.temp }}/macos-evidence/arm64
      - name: Require Intel and Apple Silicon consumer success
        shell: pwsh
        env:
          MATRIX_RESULT: ${{ needs.macos-consumers.result }}
        run: ./.github/scripts/Test-MacOSConsumers.ps1 -EvidenceRoot "$env:RUNNER_TEMP/macos-evidence" -MatrixResult $env:MATRIX_RESULT
